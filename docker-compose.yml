version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: aviara-labs-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leads_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run DDL schema on container startup
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Message Broker Service
  redis:
    image: redis:7-alpine
    container_name: aviara-labs-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Web Application Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aviara-labs-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/leads_db
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/leads_db
      - GROQ_API_KEY=gsk_your_actual_groq_api_key_here
      - GROQ_MODEL=llama-3.1-8b-instant
      - API_KEY=secret-api-key-token-here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
